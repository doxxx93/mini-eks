[tools]
# kind v0.33.0 defaults to kindest/node:v1.37.0; kubectl must stay within one minor of the apiserver.
kubectl = "1.37"
kind = "0.33.0"
shellcheck = "0.11.0"

[tasks.doctor]
description = "Check Docker and the pinned tool versions before step 01"
run = "test/doctor.sh"

[tasks.check]
description = "Check a step's result, or every step in order when no step is given"
usage = 'arg "[step]" help="Step number, e.g. 01"'
run = 'test/check.sh ${usage_step:-}'

[tasks.lint]
description = "Run shellcheck on every shell script"
run = "test/lint.sh"
